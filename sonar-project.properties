# SonarCloud analysis configuration for the Code Quality stage.
#
# sonar.token is supplied by Jenkins from its credential store at scan time and
# is deliberately absent from this file.

sonar.projectKey=Gureijaz_SIT223-7.3HD-SentinelAPI
sonar.organization=gureijaz
sonar.projectName=Sentinel API
sonar.host.url=https://sonarcloud.io

sonar.sources=src,scripts
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Generated or vendored code carries no maintainability signal and would only
# dilute the metrics the quality gate is measured against.
sonar.exclusions=node_modules/**,coverage/**,reports/**,dist/**,data/**,logs/**,src/generated/**,ops/grafana/**
sonar.test.inclusions=tests/**/*.test.js

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Test files legitimately repeat setup blocks; duplication there is not a defect.
sonar.cpd.exclusions=tests/**
